[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearingloss-variants"
version = "0.2.0"
description = "Gene-held-out pathogenicity modelling for ClinVar hearing-loss variants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
interpret = ["shap>=0.44", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
