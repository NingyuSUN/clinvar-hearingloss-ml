name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run deterministic unit tests
        run: python -m pytest tests -q
      - name: Validate public artifacts (no retraining)
        run: python tools/validate_public_artifacts.py
      - name: Check Python syntax without writing bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = (
              list(Path("src").rglob("*.py"))
              + list(Path("scripts").rglob("*.py"))
              + list(Path("tools").rglob("*.py"))
              + list(Path("tests").rglob("*.py"))
          )
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"parsed {len(files)} Python files")
          PY
